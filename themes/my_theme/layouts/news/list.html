{{ define "main" }}

{{ partial "buttons.html" .}}
<!-- Шапка -->
<div class="uk-container uk-container-large uk-margin-top">

  {{ partial "breadcrumbs.html" . }} 

  <h1 class="uk-heading-divider">{{ .Title}}</h1>

  <!-- выводим список новостей -->


  <div class="uk-child-width-1-3@m uk-child-width-1-2@s" uk-grid>
    {{ range .Pages }}


    <article class="uk-article uk-margin-remove-top">
      <h1 class="uk-article-title">{{ .Title }}</h1>
      <p class="uk-article-meta">{{ .Date | time.Format ":date_long" }}</p>

      <p>{{ .Summary}}</p>

      <div class="uk-grid-small uk-child-width-auto" uk-grid>
        <div>
          <a class="uk-button uk-button-text" href="{{ .RelPermalink }}">{{ T "detaled"}}</a>
        </div>
      </div>
    </article>



    {{ end }}

  </div>

</div>

{{ end }}
