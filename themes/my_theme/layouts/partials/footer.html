<div class="uk-container uk-container-large uk-margin-top">
  <div class="uk-margin uk-text-center">
    <a href="#" uk-totop uk-scroll></a>
  </div>



  <div class="uk-grid tm-grid-expand uk-grid-margin">
    <div class="uk-width-expand@m uk-first-column">
      <div class="uk-margin uk-text-left@s uk-text-center uk-margin-bottom">
        <a href="/" aria-label="Back to home">
          <img decoding="async" src="/images/logo_h_25-1.svg" width="242" height="25" class="el-image"
            alt="{{ .Site.Title }}" loading="lazy">
        </a>
      </div>





    </div>
    <div class="uk-width-large@m" bis_skin_checked="1">
      <div class="uk-margin uk-text-left@s uk-text-center" bis_skin_checked="1">
        <div class="uk-grid uk-child-width-1-2 uk-child-width-1-2@s uk-grid-match" uk-grid="" bis_skin_checked="1">
          <div class="uk-first-column" bis_skin_checked="1">
            <div class="el-item uk-panel uk-margin-remove-first-child" bis_skin_checked="1">
              <h3 class="el-title uk-h4 uk-margin-top uk-margin-remove-bottom"> Про Автошколу </h3>
              <div class="el-content uk-panel uk-margin-top" bis_skin_checked="1">
                <ul class="uk-list">
                  <li><a class="uk-text-capitalize uk-link-text" href="{{ .Site.LanguagePrefix }}/classes/">{{ T "classroom" }}</a></li>
                  <li><a class="uk-link-text" href="{{ .Site.LanguagePrefix }}/stuff/">{{ T "stuff" }}</a></li>
                </ul>
              </div>
            </div>
          </div>
          <div>
            <div class="el-item uk-panel uk-margin-remove-first-child" bis_skin_checked="1">
              <h3 class="uk-text-capitalize uk-h4 uk-margin-top uk-margin-remove-bottom">{{ T "education" }}</h3>
              <div class="el-content uk-panel uk-margin-top" bis_skin_checked="1">
                <ul class="uk-list">
                  <li><a class="uk-link-text" href="{{ .Site.LanguagePrefix }}/booking/">{{ T "reg_button" }}</a></li>
                  <li><a class="uk-link-text" href="{{ .Site.LanguagePrefix }}/booking_practic/">{{ T "reg_button_practic" }}</a></li>
                  <li><a class="uk-link-text" href="{{ .Site.LanguagePrefix }}/docs/">{{ T "docs" }}</a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="uk-width-expand@m">
      <h3 class="uk-h4 uk-text-left@s uk-text-center"> {{ T "social" }} </h3>
      <div class="uk-margin uk-text-left@s uk-text-center" uk-scrollspy="target: [uk-scrollspy-class];">
        <div class="uk-child-width-auto uk-grid-small uk-flex-inline uk-grid" uk-grid="">
          <div class="uk-first-column">
            <a class="el-link uk-icon-link" href="https://www.facebook.com/Avtomoto25/" rel="noreferrer"><span
                uk-icon="icon: facebook;" class="uk-icon"></span></a>
          </div>
          <div>
            <a class="el-link uk-icon-link" href="https://www.instagram.com/avtoshkolaavtomoto25/"
              rel="noreferrer"><span uk-icon="icon: instagram;" class="uk-icon"></span></a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <hr class="uk-divider-icon">

  <p class="uk-float-right uk-margin-bottom">© 2020-{{ now.Year }} {{ .Site.Title }}, All Rights Reserved ®
  </p>

</div>
