[markup]
  [markup.goldmark]     
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true 

      

    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "prebuild/public/content/classes"
    target = "content/classes"
  [[module.mounts]]
    source = "prebuild/public/content/stuff"
    target = "content/stuff"

[sitemap]
  changeFreq = 'monthly'

