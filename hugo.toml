baseURL = 'https://avtomoto25.cn.ua/'
defaultContentLanguage = 'uk'
timezone = 'Europe/Kyiv'
theme = 'uikit'
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
[params]
    api_url = "https://directus.cynic.club"
    api_auth = "Bearer 0WMIqchUCg-pWLsyOFxKOYnvBveTODTZ"
    title = 'Автошкола в місті Чернігів'
    description = 'Автошкола в місті Чернігів. Теоретичне та практичне навчання. Заочні та очні заняття'
